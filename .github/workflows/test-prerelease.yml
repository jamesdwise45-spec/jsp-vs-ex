name: test-prerelease

# FORK ONLY, never upstream: builds a friends' online TEST build and publishes it as a GitHub PRE-release of this fork.
# Started by pushing a tag test-<version> (for example test-0.7.0-test1): a tag push runs the workflow file of the tagged
# commit, so this file only has to be on the test branch, not on the default branch. <version> must equal installer/VERSION
# of that commit (assemble_payload.py --release checks it); it is baked into release.txt, so the game's main menu, the
# installer and the portable zip name all show it. The setup, the zip and SHA256SUMS are attached to the pre-release.
#
# The installer holds no game data: it builds the game on each player's PC from their own copy. No secrets are used:
# installer.yml downloads only public, SHA-256-pinned files and the submodule is a public URL.

on:
  push:
    tags: ['test-*']

permissions:
  contents: read

jobs:
  version:
    if: github.repository != 'Tsamiuy/jsp-vs-ex'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Version from the tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#test-}"
          # The same characters and length the game's version line accepts (jsp_version_line.h valid_version), as X.Y.Z[-suffix].
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || [ "${#version}" -gt 24 ]; then
            echo "tag '$TAG' does not give a version X.Y.Z or X.Y.Z-suffix (24 characters at most)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "test build $version"

  build:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/installer.yml
    with:
      portable: true
      keep_days: 14
      release_version: ${{ needs.version.outputs.version }}

  prerelease:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the pre-release
      actions: read     # download this run's artifact
    steps:
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The jsp-installer-<sha> artifact of this run (the GitHub CLI, so no extra action and no checkout are needed).
          gh run download "$GITHUB_RUN_ID" --name "jsp-installer-$GITHUB_SHA" --dir files
          ls -l files
          test -f files/jsp-setup.exe
          test -f "files/jsp-$VERSION-portable.zip"
          test -f files/SHA256SUMS
          cat > notes.md <<EOF
          Online test build $VERSION of draft PR Tsamiuy/jsp-vs-ex#248 (rollback for Online Battle). Not an official release of the project.

          ## New in test9

          - **Uninstall test8 first** (Start menu > Uninstall JSP Fan Revival), then run the new jsp-setup.exe. The main menu's lower right corner must say 0.7.0-test9 on both PCs.
          - **A slower PC now raises its own input delay.** In online fights both PCs run at the pace of the slower one. When a PC can't keep 30 fps (for example a laptop), it now adds one or two frames of input delay to itself, so its moves reach the other PC in time. That should mean far fewer rollbacks and less stutter on the faster PC. It does not make the slow PC itself faster, and the fight sound still breaks up while a fight runs under 30 fps (a fix for that is in progress). JSP_INPUT_DELAY_AUTO_SLOW_TPS=0 in play_settings.txt turns it off.
          - **Better support bundles.** The bundle now names the graphics card the game really used and notes a laptop whose screen runs through a second graphics chip.

          ## From test8

          - **Re-select character(s) opens the game's real character select.** After an online match, if either player picks Re-select character(s), both PCs go back to the room and the game's own Battle settings page opens by itself, with the series list, the character list and portraits. Pick your Battle Character, then **press Start (Finish)** to save it: Circle (Back) does not save the pick. If you back out, press Square in the room to open the page again. The host can't start the next fight until both players have finished picking. The page also shows the stage and music; whatever is chosen there, both PCs always end up on the same stage (checked in our test matches). If the page does not open, the port's own picker appears instead. JSP_PICK_NATIVE_SELECT=0 in play_settings.txt turns this off.
          - **Sturdier menu art loading.** The menu's art reader now refuses damaged or oversized game files and falls back to its drawn style instead.

          Everything from test7 is still here: the after-match menu (Fight again / Re-select character(s) / Leave) in the game's own art, the deeper fight-sound reserve (please tell us how it sounds), the hitch log, the joiner's repeating Ready, left-stick menu input, and the one-click online fix.

          **Is rollback on?** During the fight you see the ping in ms under the timer (for example \`62 ms\`). No ms counter = no rollback: check the version in the main menu corner and make a new room.

          ## Still in this build from test2 and test3

          - Each player controls their own fighter, and the joining player's buttons work on both PCs.
          - Cheaper rollbacks, an input delay that follows the connection, and rollbacks of at most 6 frames.

          ## Quick start

          1. Download **jsp-setup.exe** below and run it (or unpack the portable zip outside Program Files and run \`run.cmd\`). Windows SmartScreen may warn about an unsigned program: choose "More info" > "Run anyway".
          2. Setup asks for your own disc folder (US disc) and your own decrypted \`EBOOT.elf\`, then builds the game on your PC (several minutes; longer on an older PC).
          3. Turn online on: the game's shortcut opens the settings window. Go to the **Online** tab and click **Use Friends' online test server (TEST BUILD)** at the top. One click; nothing changes before it, and settings you already have are kept. Then click **Start Game**. An offline warm-up fight is optional: online fights prepare new graphics in the background.
          4. Online: Main Menu > Battle Modes > Online Battle > Friendly Match. One player picks **Create a Room**, the other **Search for a Room** and joins it. The host starts the fight.
          5. When the fight starts you see \`Rollback on: direct connection\` (or \`connected through the server\`), and the ping in ms under the timer. After the match, choose Fight again, Re-select character(s) or Leave (Circle).

          Online is one click: in the settings window (the game's shortcut), **Online** tab, click **Use Friends' online test server (TEST BUILD)**. That turns on the public test server (re-psn), a random name (change it in the same tab), rollback and Discord Rich Presence. Nothing is set up before that click. No IP addresses or port forwarding needed. If Windows asks to allow the game through the firewall, click **Allow access**.

          ## Limits of this build

          - Online is 2 vs 2; each player has 1 fighter + 1 support and COM fighters fill the rest. The host can put the two players on opposite teams or together.
          - In the first match only the host picks characters (the game's own Friendly Match room); the joiner is on Random Select. After a match, Re-select character(s) lets both players pick.
          - To host, keep Object draw distance, Model detail and Shadow range at their defaults in the settings window: other values make the room refuse to start (not fixed in code yet).
          - The after-match menu takes the D-pad or the left stick; Up or Down moves to the other choice. If anything in the menu misbehaves, tell us and send a support bundle (JSP_ROLLBACK_PICK=0 in play_settings.txt turns the menu off).
          - If the game shows a notice over the room after a match (for example "You got a new title."), the game's character select may not open for that round: the port's own picker appears instead. It still works; the next round uses the game's page again.
          - The fight sound is made frame by frame so both PCs stay in sync: if either PC can't keep 30 fps, the sound breaks up on both. On a laptop: plug it in, set Windows to Best performance, set jsp.exe to High performance in Windows Settings > Display > Graphics, and turn effects and shadows down.
          - Sudden freezes in the connection itself (100+ ms with no data) can still cause a short hitch.

          If something goes wrong, run \`support-bundle.cmd\` in the install folder and send the file it makes. Everyone in a match must use this same build (the main menu shows $VERSION). SHA256SUMS lists each file's hash. Full guide and troubleshooting: ONLINE-GUIDE.md in the install folder. No game data is included: the game is built on your PC from your own copy.
          EOF
          gh release create "$TAG" --prerelease --draft --verify-tag --title "J-Stars Victory VS EX online test $VERSION" \
            --notes-file notes.md files/jsp-setup.exe "files/jsp-$VERSION-portable.zip" files/SHA256SUMS
